[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-nlp-classifier"
version = "0.1.0"
description = "Reproducible NLP classification of consumer financial complaints"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.3,<2", "pandas>=2.0,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]
